---
version: 2
project_name: filesystem-exporter

builds:
  - id: filesystem-exporter
    main: ./cmd/filesystem-exporter
    binary: filesystem-exporter
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README*
      - deploy/kubernetes/*
      - Dockerfile

checksum:
  name_template: checksums.txt

dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    ids:
      - filesystem-exporter
    images:
      - ghcr.io/containeroo/filesystem-exporter
      - containeroo/filesystem-exporter
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --pull
      - --cache-from=type=gha,scope=filesystem-exporter
      - --cache-to=type=gha,mode=max,scope=filesystem-exporter
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Prometheus exporter for filesystem usage
      org.opencontainers.image.url: https://github.com/containeroo/filesystem-exporter
      org.opencontainers.image.source: https://github.com/containeroo/filesystem-exporter
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: '{{ time "2006-01-02T15:04:05Z07:00" }}'
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  prerelease: auto
