apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: filesystem-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: filesystem-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filesystem-exporter
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
